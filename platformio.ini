; PlatformIO-project voor de hartketting.
; pioarduino 55.03.312 = Arduino-framework 3.3.12 voor de ESP32.
; De versie staat vast, zodat iedereen in het team hetzelfde bouwt.

[platformio]
src_dir = src/hartketting

[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
